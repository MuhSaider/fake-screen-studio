<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fake Screen Studio — Preview</title>

    <div id="stage"></div>

    <div id="controls">

    <script type="module" src="/src/main.ts"></script>
